# AutoML Agent Configuration

# Budget Configuration
budget:
  max_iterations: 10
  max_time_seconds: 3600  # 1 hour
  max_trials_per_model: 50
  early_stopping_rounds: 3  # Stop if no improvement

# LLM Configuration
# Supports both OpenAI and Azure OpenAI
llm:
  # Provider: "openai" or "azure"
  provider: "azure"

  # For OpenAI: model name (e.g., "gpt-4-turbo-preview", "gpt-4", "gpt-3.5-turbo")
  # model: "gpt-4-turbo-preview"

  # For Azure OpenAI: deployment name and API version
  deployment_name: "gpt-4o-mini"  # Your Azure deployment name
  api_version: "2025-01-01-preview"  # Azure API version

  temperature: 0.7
  max_tokens: 2000

# Metrics Configuration
metrics:
  primary: "accuracy"  # or "f1", "roc_auc", "rmse", "r2", etc.
  secondary:
    - "precision"
    - "recall"
    - "f1"

  # Task type: "classification" or "regression"
  task_type: "classification"

# Model Families to Consider
model_families:
  - "lightgbm"
  - "xgboost"
  - "catboost"
  - "random_forest"
  - "logistic_regression"

# HPO Configuration
hpo:
  engine: "flaml"  # or "optuna"
  n_trials: 50
  time_budget: 300  # seconds per model

# Data Configuration
data:
  test_size: 0.2
  validation_size: 0.2
  random_state: 42
  stratify: true

# Preprocessing Configuration
preprocessing:
  auto_detect: true
  handle_missing: true
  handle_categorical: true
  scale_features: true
  remove_outliers: false

# Logging Configuration
logging:
  use_mlflow: true
  mlflow_tracking_uri: "./mlruns"
  experiment_name: "automl_experiment"
  log_level: "INFO"

# Output Configuration
output:
  save_model: true
  save_metrics: true
  save_summary: true
  generate_report: false
